name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  MARQUEE_DEPS_CACHE: ${{ github.workspace }}/.deps-cache

jobs:
  # Builds universal libtorrent + OpenSSL once; every other job downloads the result.
  deps:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          xc=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xc/Contents/Developer"
          swift --version
      - name: Compute cache key
        id: key
        run: echo "key=$(scripts/build-libtorrent.sh --print-key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .deps-cache/out
          key: native-deps-${{ steps.key.outputs.key }}
      - name: Build libtorrent (skipped on cache hit)
        run: |
          command -v ninja >/dev/null || brew install ninja
          scripts/build-libtorrent.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vendor-libtorrent
          path: Vendor/libtorrent
          include-hidden-files: true
          retention-days: 1

  # Builds the LGPL, universal libmpv + FFmpeg dylibs (scripts/build-mpv.sh) once. The finished
  # output is cached on the script's key (versions + script hash), so it only rebuilds when the
  # script changes. Build tools only from Homebrew; nothing from Homebrew is linked.
  deps-mpv:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          xc=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xc/Contents/Developer"
          swift --version
      - name: Compute cache key
        id: key
        run: echo "key=$(scripts/build-mpv.sh --print-key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .deps-cache/mpv-out
          key: mpv-deps-${{ steps.key.outputs.key }}
      - name: Build libmpv + FFmpeg (skipped on cache hit)
        run: |
          for t in meson ninja nasm pkg-config; do command -v $t >/dev/null || brew install $t; done
          scripts/build-mpv.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vendor-mpv
          path: Vendor/mpv
          include-hidden-files: true
          retention-days: 1

  test:
    needs: [deps, deps-mpv]
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          xc=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xc/Contents/Developer"
          swift --version
      - uses: actions/download-artifact@v4
        with:
          name: vendor-libtorrent
          path: Vendor/libtorrent
      - uses: actions/download-artifact@v4
        with:
          name: vendor-mpv
          path: Vendor/mpv
      - run: swift test

  build:
    needs: [deps, test]
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          xc=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xc/Contents/Developer"
          swift --version
      - uses: actions/download-artifact@v4
        with:
          name: vendor-libtorrent
          path: Vendor/libtorrent
      - name: Build ${{ matrix.arch }}
        run: swift build -c release --arch ${{ matrix.arch }} --product Marquee
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.arch }}
          path: .build/${{ matrix.arch }}-apple-macosx/release/Marquee

  release:
    needs: [build, deps-mpv]
    runs-on: macos-26
    timeout-minutes: 45
    env:
      VERSION: 0.1.${{ github.run_number }}
      REQUIRE_FRAMEWORKS: 1
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          xc=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xc/Contents/Developer"
          swift --version
      - uses: actions/download-artifact@v4
        with:
          name: vendor-mpv
          path: Vendor/mpv
      - uses: actions/download-artifact@v4
        with:
          path: bins
          pattern: bin-*
      - name: Package arm64, x86_64 and universal
        run: |
          mkdir -p dist
          lipo -create bins/bin-arm64/Marquee bins/bin-x86_64/Marquee -output bins/Marquee-universal
          for v in arm64 x86_64 universal; do
            bin="bins/bin-$v/Marquee"; [ "$v" = universal ] && bin="bins/Marquee-universal"
            chmod +x "$bin"
            arch="$v"; [ "$v" = universal ] && arch=""
            BUNDLE_ARCH="$arch" scripts/bundle.sh "$bin" "dist/Marquee-$v/Marquee.app" "$VERSION"
            ditto -c -k --keepParent "dist/Marquee-$v/Marquee.app" "dist/Marquee-$VERSION-macos-$v.zip"
          done
      - name: Checksum the release artifacts
        run: |
          shasum -a 256 dist/*.zip > dist/SHASUMS.txt
          cat dist/SHASUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/*.zip \
            --title "Marquee $VERSION" \
            --generate-notes \
            --prerelease

      # --- In-app updater feed (scripts/make-appcast.sh + scripts/publish-updates.sh) ----------
      # The GitHub Release above is already public by this point, so a failure here must not turn
      # the job red: a red X on every push buries real breakage. Every step below continues on
      # error, annotates the run, and leaves the generated manifest as a workflow artifact that
      # can be deployed by hand. Nothing is committed or pushed back to the repo -- the feed
      # lives only on the VPS.
      - name: Generate the signed appcast
        id: appcast
        continue-on-error: true
        env:
          APPCAST_PEM: ${{ secrets.MARQUEE_APPCAST_KEY_PEM }}
          APPCAST_KEY_FILE: ${{ runner.temp }}/marquee-appcast-key.pem
          RELEASE_CHANNEL: ${{ vars.MARQUEE_RELEASE_CHANNEL || 'beta' }}
        run: |
          set -uo pipefail
          # macOS runners have LibreSSL at /usr/bin/openssl and no Ed25519 in it. Homebrew's
          # OpenSSL 3 is not installed by default, so signing would fail with a message that reads
          # like a key problem. Install it and put it first on PATH.
          if ! openssl genpkey -algorithm ed25519 -out "$RUNNER_TEMP/probe.pem" >/dev/null 2>&1; then
            echo "installing openssl@3 (the default openssl has no Ed25519)"
            brew install openssl@3
            echo "::add-path::$(brew --prefix openssl@3)/bin"
            export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          fi
          rm -f "$RUNNER_TEMP/probe.pem"
          if [ -z "${APPCAST_PEM:-}" ]; then
            echo "::warning title=Appcast::MARQUEE_APPCAST_KEY_PEM is unset; update feed skipped"
            exit 0
          fi
          umask 077
          printf '%s\n' "$APPCAST_PEM" > "$APPCAST_KEY_FILE"
          mkdir -p site
          if scripts/make-appcast.sh --version "$VERSION" --dir dist --base https://tv.guihot.net \
              --out site --channel "$RELEASE_CHANNEL" --key "$APPCAST_KEY_FILE"; then
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Appcast::could not generate the manifest; the feed is unchanged"
          fi
      - name: Deploy the appcast to the update host
        id: deploy
        needs: appcast
        if: ${{ success() && steps.appcast.outputs.generated == 'true' }}
        continue-on-error: true
        env:
          DEPLOY_KEY: ${{ secrets.MARQUEE_DEPLOY_KEY }}
          PINNED_HOSTS: ${{ secrets.MARQUEE_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.MARQUEE_DEPLOY_HOST }}
          DEPLOY_KEY_FILE: ${{ runner.temp }}/marquee-deploy-key
          PINNED_HOSTS_FILE: ${{ runner.temp }}/marquee-known-hosts
        run: |
          set -uo pipefail
          warn() { echo "::warning title=Appcast::$1"; }
          if [ -z "${DEPLOY_KEY:-}" ]; then
            warn "MARQUEE_DEPLOY_KEY is unset; the manifest is in this run's appcast artifact"
            exit 0
          fi
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$DEPLOY_KEY_FILE"
          # The pinned host key comes from the repo when it is committed and from a secret
          # otherwise. publish-updates.sh has no way to disable host key checking, by design.
          if [ -f scripts/site/known_hosts ]; then
            known=scripts/site/known_hosts
          elif [ -n "${PINNED_HOSTS:-}" ]; then
            printf '%s\n' "$PINNED_HOSTS" > "$PINNED_HOSTS_FILE"
            known="$PINNED_HOSTS_FILE"
          else
            warn "no pinned host key (scripts/site/known_hosts or MARQUEE_KNOWN_HOSTS); not deploying"
            exit 0
          fi
          if scripts/publish-updates.sh --host "${DEPLOY_HOST:-85.155.188.130}" --local site \
              --version "$VERSION" --known-hosts "$known" --identity "$DEPLOY_KEY_FILE"; then
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          else
            warn "deploy of $VERSION failed; the GitHub Release is unaffected. Publish it by hand with:
              scripts/publish-updates.sh --host <host> --local site --version $VERSION"
          fi
      - name: Upload the appcast artifact
        if: ${{ always() && steps.appcast.outputs.generated == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: appcast-${{ env.VERSION }}
          path: site/appcast-*
          retention-days: 30
      - name: Remove deploy credentials
        if: ${{ always() }}
        run: rm -f "${{ runner.temp }}/marquee-deploy-key" \
                  "${{ runner.temp }}/marquee-appcast-key.pem" \
                  "${{ runner.temp }}/marquee-known-hosts"
