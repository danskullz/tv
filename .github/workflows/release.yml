name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  MARQUEE_DEPS_CACHE: ${{ github.workspace }}/.deps-cache

jobs:
  # Builds universal libtorrent + OpenSSL once; every other job downloads the result.
  deps:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          xc=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xc/Contents/Developer"
          swift --version
      - name: Compute cache key
        id: key
        run: echo "key=$(scripts/build-libtorrent.sh --print-key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .deps-cache/out
          key: native-deps-${{ steps.key.outputs.key }}
      - name: Build libtorrent (skipped on cache hit)
        run: |
          command -v ninja >/dev/null || brew install ninja
          scripts/build-libtorrent.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vendor-libtorrent
          path: Vendor/libtorrent
          include-hidden-files: true
          retention-days: 1

  test:
    needs: deps
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          xc=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xc/Contents/Developer"
          swift --version
      - uses: actions/download-artifact@v4
        with:
          name: vendor-libtorrent
          path: Vendor/libtorrent
      - run: swift test

  build:
    needs: [deps, test]
    runs-on: macos-26
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          xc=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xc/Contents/Developer"
          swift --version
      - uses: actions/download-artifact@v4
        with:
          name: vendor-libtorrent
          path: Vendor/libtorrent
      - name: Build ${{ matrix.arch }}
        run: swift build -c release --arch ${{ matrix.arch }} --product Marquee
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.arch }}
          path: .build/${{ matrix.arch }}-apple-macosx/release/Marquee

  release:
    needs: build
    runs-on: macos-26
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          xc=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xc/Contents/Developer"
          swift --version
      - uses: actions/download-artifact@v4
        with:
          path: bins
      - name: Package arm64, x86_64 and universal
        run: |
          mkdir -p dist
          lipo -create bins/bin-arm64/Marquee bins/bin-x86_64/Marquee -output bins/Marquee-universal
          for v in arm64 x86_64 universal; do
            bin="bins/bin-$v/Marquee"; [ "$v" = universal ] && bin="bins/Marquee-universal"
            chmod +x "$bin"
            scripts/bundle.sh "$bin" "dist/Marquee-$v/Marquee.app" "$VERSION"
            ditto -c -k --keepParent "dist/Marquee-$v/Marquee.app" "dist/Marquee-$VERSION-macos-$v.zip"
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/*.zip \
            --title "Marquee $VERSION" \
            --generate-notes \
            --prerelease
