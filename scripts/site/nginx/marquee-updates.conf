# marquee-updates.conf -- HTTP contract for the Marquee in-app updater.
#
# WHAT THIS FILE OWNS (and nothing else):
#     = /appcast.json          the live manifest (a symlink to appcast-<version>.json)
#     = /appcast.json.sig      convenience alias for its signature; clients should use
#                              manifest.signatureURL (appcast-<version>.sig) instead
#     /appcast-<version>.json  immutable, signed manifest of a specific release
#     /appcast-<version>.sig   immutable detached signature of that manifest
#     /downloads/              the .zip builds, addressed by the manifest
#
# IT MUST NOT DEFINE server, root, index, listen, upstream or any other top-level directive.
# Include it *inside* the server {} block that the site config owns:
#
#     server {
#         listen 443 ssl;
#         server_name tv.guihot.net;
#         root /usr/share/nginx/html;
#         include /etc/nginx/conf.d.d/*.conf;   # <- this file lands here
#         ...
#     }
#
# The document root is a bind mount of /srv/tv.guihot.net on the host, so release artifacts are
# rsynced straight into the served directory and no image ever needs rebuilding.
#
# WHY EVERY LOCATION DECLARES ITS OWN add_header
#     nginx's add_header does not merge across blocks: the moment a nested block declares one,
#     every add_header inherited from the parent is dropped. A single header here is therefore
#     declared per location on purpose -- adding a Cache-Control to one place will not "spread".
#     NPM's per-domain "Custom Headers" field is the alternative if the parent server block needs
#     headers of its own; set them there, or the ones below win.
#
# THE ONE HEADER THAT MATTERS MOST
#     Cache-Control: no-cache on /appcast.json. Without it a CDN (or an aggressive proxy) will
#     serve a stale manifest for hours and no user ever sees the new release. no-cache means
#     "revalidate every time" -- it is cacheable but never served stale. The versioned files and
#     /downloads/ are genuinely immutable (a new version is a new URL, and the zips are named by
#     release), so they get a one-year immutable header.
#
# 304s ARE DISABLED ON THE MUTABLE PATHS ON PURPOSE
#     etag off + if_modified_since off below force a 200 with a body. A manifest fetch that
#     answers 304 with no body is indistinguishable from an empty feed to a simple client, and
#     silently stops updates. The file is ~5 KB; there is nothing to save.

# --- The live manifest. Never cached, never a 304, always a full body. ----------------------
location = /appcast.json {
    default_type application/json;
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-cache" always;
    add_header Pragma "no-cache" always;
}

# --- Convenience alias for its signature. See the note above: prefer signatureURL. ----------
location = /appcast.json.sig {
    default_type application/octet-stream;
    etag off;
    if_modified_since off;
    access_log off;
    add_header Cache-Control "no-cache" always;
    add_header Pragma "no-cache" always;
}

# --- Per-version manifest: immutable, the URL changes with the content. ----------------------
location ~ "^/appcast-[0-9][0-9.]*\.json$" {
    default_type application/json;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# --- Per-version signature: immutable, and 64 bytes nobody needs in the access log. ----------
location ~ "^/appcast-[0-9][0-9.]*\.sig$" {
    default_type application/octet-stream;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# --- The builds. ^~ so a regex location elsewhere cannot capture them. -----------------------
# --- Immutable is honest here: a republished version keeps its filename and its manifest      ---
# --- sha256 is the only thing that changes, and clients verify it.                             ---
location ^~ /downloads/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
