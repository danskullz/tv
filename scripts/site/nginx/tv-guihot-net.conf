# tv.guihot.net — Marquee's in-app update host.
#
# This is the Nginx Proxy Manager side of the site. It is installed as
# `/data/nginx/custom/http_top.conf` inside the `npm` container, which NPM includes inside the
# `http {}` block, ahead of its own proxy-host configs.
#
# WHY NOT A PROXY HOST
#     A Proxy Host would be the tidier object, but creating one needs NPM admin credentials. This
#     file claims exactly one hostname and changes nothing else on the box, so the update site can
#     be deployed without touching any other domain that NPM is serving.
#
# WHERE THE FILES ARE
#     Served by the `marquee-updates` container (nginx:alpine) on the shared `edge` network, with
#     /home/dan/www/tv.guihot.net bind-mounted as its document root. Releases are rsynced into that
#     directory from CI and need no container or image rebuild.
#
# THE ONE HEADER THAT MATTERS MOST
#     Cache-Control: no-cache on the manifest. A CDN or proxy holding it means users do not see a
#     new release for hours, which is indistinguishable from "no update available". `no-cache`
#     still permits revalidation — it just never serves stale.
#
# WHY ETags ARE OFF ON THE MANIFEST
#     A 304 with no body is easy to mistake for an empty feed and silently stops updates. The file
#     is about 1 KB; saving nothing is not worth that failure mode. The versioned files are
#     immutable by construction — a new release is a new URL — so they keep a long cache.
#
# nginx's `add_header` does not merge: a nested block that declares one drops every add_header
# inherited from its parent. Each location here therefore declares its own, deliberately.

upstream marquee_updates {
    server marquee-updates:80;
    keepalive 4;
}

# --- Plain HTTP: ACME only, everything else redirected. ---------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name tv.guihot.net;

    # Let's Encrypt HTTP-01. Proxied to the site container, which has the web root mounted.
    location /.well-known/acme-challenge/ {
        proxy_pass http://marquee_updates;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: the actual update host. -------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tv.guihot.net;

    # Issued by certbot (webroot) straight into NPM's /etc/letsencrypt, so this is the same place
    # NPM keeps certificates it manages itself.
    ssl_certificate     /etc/letsencrypt/live/tv.guihot.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tv.guihot.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:MarqueeTLS:4m;
    ssl_session_timeout 1h;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # The live manifest: a symlink to the current appcast-<version>.json.
    location = /appcast.json {
        proxy_pass http://marquee_updates;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache" always;
        add_header Pragma "no-cache" always;
    }

    # Versioned manifests and their detached signatures. Immutable: a new release is a new URL.
    location ~ ^/appcast-[0-9][^/]*\.(json|sig)$ {
        proxy_pass http://marquee_updates;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Release archives. Named by version and pinned by the SHA-256 in the signed manifest, so a
    # long cache here is honest rather than merely convenient.
    location /downloads/ {
        proxy_pass http://marquee_updates;
        proxy_set_header Host $host;
        proxy_buffering off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The site itself, so the hostname answers on a browser rather than 404ing.
    location / {
        proxy_pass http://marquee_updates;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=300" always;
    }
}